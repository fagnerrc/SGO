<style>
  .v10-sync-wrap { display:flex; align-items:center; gap:6px; }
  .v10-sync-status { min-height:34px; display:inline-flex; align-items:center; gap:7px; padding:6px 10px; border:1px solid var(--border); border-radius:10px; background:var(--surface); color:var(--muted); font-size:10px; font-weight:750; white-space:nowrap; box-shadow:var(--shadow-sm); }
  .v10-sync-status::before { content:""; width:8px; height:8px; border-radius:50%; background:#8d96a8; box-shadow:0 0 0 3px rgba(141,150,168,.12); }
  .v10-sync-status[data-state="updated"]::before { background:var(--green); box-shadow:0 0 0 3px var(--green-soft); }
  .v10-sync-status[data-state="checking"]::before,
  .v10-sync-status[data-state="syncing"]::before,
  .v10-sync-status[data-state="saving"]::before { background:var(--blue); box-shadow:0 0 0 3px var(--blue-soft); animation:v10pulse 1.1s infinite; }
  .v10-sync-status[data-state="pending"]::before,
  .v10-sync-status[data-state="stale"]::before { background:var(--orange); box-shadow:0 0 0 3px var(--peach-soft); }
  .v10-sync-status[data-state="conflict"]::before,
  .v10-sync-status[data-state="offline"]::before,
  .v10-sync-status[data-state="error"]::before { background:var(--red); box-shadow:0 0 0 3px var(--pink-soft); }
  @keyframes v10pulse { 50% { opacity:.35; transform:scale(.78); } }
  .v10-sync-time { color:var(--muted-2); font-weight:600; }

  .v10-notification-wrap { position:relative; }
  .v10-icon-button { position:relative; width:40px; height:40px; display:grid; place-items:center; border:1px solid var(--border); border-radius:11px; background:var(--surface); color:var(--text); box-shadow:var(--shadow-sm); cursor:pointer; }
  .v10-icon-button svg { width:17px; }
  .v10-notification-badge { position:absolute; top:-5px; right:-5px; min-width:19px; height:19px; padding:0 5px; display:grid; place-items:center; border:2px solid var(--surface); border-radius:999px; background:var(--red); color:#fff; font-size:9px; font-weight:850; }
  .v10-dropdown { position:absolute; top:46px; right:0; z-index:120; width:min(390px,calc(100vw - 24px)); max-height:480px; overflow:auto; border:1px solid var(--border); border-radius:14px; background:var(--surface); box-shadow:var(--shadow-md); }
  .v10-dropdown-head { position:sticky; top:0; z-index:2; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:13px; border-bottom:1px solid var(--border); background:rgba(255,255,255,.96); }
  .v10-dropdown-list { display:flex; flex-direction:column; }
  .v10-notification-item { display:flex; gap:10px; width:100%; padding:12px 13px; border-bottom:1px solid var(--border); background:transparent; text-align:left; cursor:pointer; }
  .v10-notification-item.unread { background:var(--primary-soft); }
  .v10-notification-item:last-child { border-bottom:0; }
  .v10-notification-item strong { display:block; font-size:11px; }
  .v10-notification-item p { margin-top:3px; color:var(--muted); font-size:10px; line-height:1.45; }
  .v10-notification-item time { display:block; margin-top:5px; color:var(--muted-2); font-size:9px; }

  .v10-feedback-list, .v10-chat-messages { display:flex; flex-direction:column; gap:8px; }
  .v10-feedback-card { padding:11px; border:1px solid var(--border); border-radius:11px; background:var(--surface-soft); }
  .v10-feedback-head, .v10-message-head { display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
  .v10-feedback-head strong, .v10-message-head strong { font-size:11px; }
  .v10-feedback-head span, .v10-message-head span { color:var(--muted); font-size:9px; }
  .v10-feedback-card p, .v10-message-card p { margin-top:6px; font-size:11px; line-height:1.55; white-space:pre-wrap; overflow-wrap:anywhere; }
  .v10-feedback-meta { display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; }
  .v10-composer { display:grid; gap:8px; margin-top:10px; padding-top:10px; border-top:1px solid var(--border); }
  .v10-composer-row { display:flex; gap:8px; flex-wrap:wrap; }
  .v10-composer-row > * { flex:1; min-width:130px; }

  .v10-chat-layout { display:grid; grid-template-columns:minmax(240px,.7fr) minmax(0,1.7fr); gap:14px; min-height:580px; }
  .v10-conversation-list { max-height:620px; overflow:auto; }
  .v10-conversation-item { width:100%; padding:11px; border-bottom:1px solid var(--border); background:transparent; text-align:left; cursor:pointer; }
  .v10-conversation-item.active { background:var(--primary-soft); }
  .v10-conversation-item strong { display:block; font-size:11px; }
  .v10-conversation-item p { margin-top:3px; color:var(--muted); font-size:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .v10-chat-panel { display:flex; flex-direction:column; min-height:560px; }
  .v10-chat-messages { flex:1; max-height:470px; overflow:auto; padding:4px; }
  .v10-message-card { max-width:82%; padding:10px 11px; border:1px solid var(--border); border-radius:12px; background:var(--surface-soft); }
  .v10-message-card.mine { margin-left:auto; color:#fff; background:var(--primary); border-color:transparent; }
  .v10-message-card.mine .v10-message-head span { color:rgba(255,255,255,.72); }
  .v10-chat-compose { display:flex; gap:8px; padding-top:12px; border-top:1px solid var(--border); }
  .v10-chat-compose textarea { flex:1; min-height:58px; }

  .v10-error-table .badge { min-width:70px; justify-content:center; }
  .v10-problem-button { position:fixed; left:calc(var(--sidebar) + 20px); bottom:18px; z-index:80; }

  .v10-conflict-panel { padding:13px; margin-bottom:12px; border:1px solid #f0c8d2; border-radius:12px; background:#fff8f9; color:var(--red); }
  .v10-conflict-panel strong { display:block; font-size:12px; }
  .v10-conflict-panel p { margin-top:4px; font-size:10px; line-height:1.5; }
  .v10-dirty-note { display:none; padding:8px 12px; color:var(--orange); background:var(--peach-soft); font-size:10px; font-weight:700; }
  .v10-dirty-note.visible { display:block; }
  .v10-save-locked { opacity:.55; pointer-events:none; }

  @media (max-width:1100px) {
    .v10-sync-status .v10-sync-time { display:none; }
    .v10-sync-status { max-width:130px; overflow:hidden; text-overflow:ellipsis; }
  }
  @media (max-width:820px) {
    .v10-sync-wrap { position:fixed; left:12px; right:12px; bottom:78px; z-index:87; justify-content:center; pointer-events:none; }
    .v10-sync-wrap > * { pointer-events:auto; }
    .v10-chat-layout { grid-template-columns:1fr; }
    .v10-chat-panel { min-height:480px; }
    .v10-problem-button { left:14px; bottom:138px; }
  }
</style>
<style>
.v10-feedback-card.unread{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-soft)}
.v10-feedback-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:9px}
.v10-feedback-status{width:auto;min-width:190px}
.v10-reply-button{margin-top:6px;align-self:flex-end}
.v10-reply-quote,.v10-reply-preview{padding:8px 10px;border-left:3px solid var(--primary);border-radius:8px;background:var(--primary-soft);font-size:10px}
.v10-reply-quote strong,.v10-reply-quote span,.v10-reply-preview strong,.v10-reply-preview span{display:block}
.v10-reply-preview{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0}
.timeline-item{display:grid;grid-template-columns:14px 1fr;gap:9px;position:relative}
.timeline-dot{width:9px;height:9px;margin-top:5px;border-radius:50%;background:var(--primary)}
.timeline-head{display:flex;justify-content:space-between;gap:10px;font-size:10px}
.timeline-item p{margin-top:3px;font-size:11px;white-space:pre-wrap;overflow-wrap:anywhere}
.timeline-item small{display:block;margin-top:3px;color:var(--muted);font-size:9px}
</style>
<style>
.v10-admin-summary{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.v10-admin-summary span{padding:7px 9px;border-radius:9px;background:var(--surface-soft);font-size:10px}.v10-admin-summary strong{color:var(--primary-dark);font-size:13px}
</style>
<style>
.control.v10-field-conflict{border-color:var(--orange)!important;box-shadow:0 0 0 3px var(--peach-soft)!important;background:#fffaf6}
</style>
<style>.v10-load-older{margin:0 auto 10px;display:flex}</style>
